# ============================================================
# reddie.id / www.reddie.id — halaman utama.
#
# Menyajikan berkas yang sama dengan contoh.reddie.id/dev-reddie/, tapi dari
# AKAR domain. Karena live.js memanggil API secara relatif ("api/..."), di sini
# alamatnya menjadi /api/... — bukan /dev-reddie/api/... seperti di demos.conf.
# Tanpa blok proxy di bawah, seluruh panggilan itu jatuh ke try_files dan
# dibalas 404: konten CMS tidak termuat, daftar model kosong sehingga chat
# tampak "DeepSeek mati", jadwal Google tidak terbaca, dan seterusnya. Halaman
# tetap terbuka dengan rapi, jadi kegagalannya tidak terlihat seperti kegagalan.
# ============================================================

# Nilai header Connection untuk WebSocket: 'upgrade' saat klien memintanya,
# kosong untuk permintaan biasa.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    error_page  404  /404.html;
    location = /404.html {
        internal;
    }

    # API Reddie (CMS + chat) — proxy ke container reddie-api.
    # Regex + variabel di proxy_pass DISENGAJA. Dengan nama host biasa, nginx
    # me-resolve "reddie-api" SEKALI saat start lalu memegang IP itu selamanya.
    # Tiap `docker compose up --build` memberi container IP baru, dan nginx
    # tetap menembak IP lama sampai di-reload manual — seluruh /api/* balas 502
    # padahal aplikasinya sehat. Memakai variabel memaksa nginx bertanya ke DNS
    # Docker (127.0.0.11) tiap permintaan.
    location ~ ^/api/(.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $reddie_upstream reddie-api;
        proxy_pass http://$reddie_upstream:8080/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket: tanpa dua header ini nginx menutup permintaan upgrade
        # dan koneksi gagal tanpa pesan yang menjelaskan.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 90s;      # panggilan LLM bisa lama; juga menjaga WS tetap hidup

        # 13 MB: sedikit di atas batas aplikasi (lampiran 12 MB, gambar 8 MB)
        # supaya penolakan datang dari aplikasi dengan pesan yang menjelaskan,
        # bukan dari nginx dengan 413 telanjang tanpa keterangan.
        client_max_body_size 13m;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
