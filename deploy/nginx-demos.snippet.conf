# ============================================================
# Tambahkan blok location ini ke /home/wit/docker-infra/demos.conf,
# DI DALAM blok server{}, DI ATAS "location / { ... }".
# Meneruskan /dev-reddie/api/* ke container reddie-api.
# ============================================================

    location /dev-reddie/api/ {
        proxy_pass http://reddie-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;      # panggilan LLM bisa lama
        # WAJIB cukup besar: jalur ini juga dipakai unggah gambar CMS (8 MB)
        # dan lampiran dokumen (12 MB). Nilai yang terlalu kecil membuat nginx
        # menolak dengan 413 sebelum permintaan sampai ke aplikasi, sehingga
        # pengguna hanya melihat "HTTP 413" tanpa keterangan apa pun.
        # 13m dipilih sedikit di atas batas aplikasi, supaya penolakan datang
        # dari aplikasi lengkap dengan pesan yang menjelaskan.
        client_max_body_size 13m;
    }
