# ============================================================
# Potongan konfigurasi untuk /home/wit/docker-infra/demos.conf
#
# 1. Blok `map` di bawah harus berada di level http (paling atas berkas),
#    DI LUAR blok server{} — nginx menolak map di dalam server.
# 2. Blok `location` ditempel DI DALAM server{}, DI ATAS "location / { }".
#
# Meneruskan /dev-reddie/api/* ke container reddie-api, termasuk WebSocket.
# ============================================================

# Nilai header Connection untuk WebSocket: 'upgrade' saat klien memintanya,
# kosong untuk permintaan biasa.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

    # Regex + variabel di proxy_pass DISENGAJA. Dengan nama host biasa,
    # nginx me-resolve "reddie-api" SEKALI saat start lalu memegang IP itu
    # selamanya. Tiap `docker compose up --build` memberi container IP baru,
    # dan nginx tetap menembak IP lama sampai di-reload manual — seluruh
    # /api/* balas 502 padahal aplikasinya sehat. Memakai variabel memaksa
    # nginx bertanya ke DNS Docker (127.0.0.11) tiap permintaan.
    location ~ ^/dev-reddie/api/(.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $reddie_upstream reddie-api;
        proxy_pass http://$reddie_upstream:8080/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket: tanpa dua header ini nginx menutup permintaan upgrade
        # dan koneksi gagal tanpa pesan yang menjelaskan.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 90s;      # panggilan LLM bisa lama; juga menjaga WS tetap hidup

        # 13 MB: sedikit di atas batas aplikasi (lampiran 12 MB, gambar 8 MB)
        # supaya penolakan datang dari aplikasi dengan pesan yang menjelaskan,
        # bukan dari nginx dengan 413 telanjang tanpa keterangan.
        client_max_body_size 13m;
    }
