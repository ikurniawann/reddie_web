# ============================================================
# Tambahkan blok location ini ke /home/wit/docker-infra/demos.conf,
# DI DALAM blok server{}, DI ATAS "location / { ... }".
# Meneruskan /dev-reddie/api/* ke container reddie-api.
# ============================================================

    # Regex + variabel di proxy_pass DISENGAJA. Dengan nama host biasa,
    # nginx me-resolve "reddie-api" SEKALI saat start lalu memegang IP itu
    # selamanya. Tiap `docker compose up --build` memberi container IP baru,
    # dan nginx tetap menembak IP lama sampai di-reload manual — seluruh
    # /api/* balas 502 padahal aplikasinya sehat. Memakai variabel memaksa
    # nginx bertanya ke DNS Docker (127.0.0.11) tiap permintaan.
    location ~ ^/dev-reddie/api/(.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $reddie_upstream reddie-api;
        proxy_pass http://$reddie_upstream:8080/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;      # panggilan LLM bisa lama

        # 13 MB: sedikit di atas batas aplikasi (lampiran 12 MB, gambar 8 MB)
        # supaya penolakan datang dari aplikasi dengan pesan yang menjelaskan,
        # bukan dari nginx dengan 413 telanjang tanpa keterangan.
        client_max_body_size 13m;
    }
