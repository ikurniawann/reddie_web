# ============================================================
# Tambahkan blok location ini ke /home/wit/docker-infra/demos.conf,
# DI DALAM blok server{}, DI ATAS "location / { ... }".
# Meneruskan /dev-reddie/api/* ke container reddie-api.
# ============================================================

    location /dev-reddie/api/ {
        proxy_pass http://reddie-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;      # panggilan LLM bisa lama
        client_max_body_size 256k;
    }
